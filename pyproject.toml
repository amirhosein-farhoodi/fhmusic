[project]
name = "autodj"
version = "0.1.0"
description = "Self-playing generative industrial techno DJ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
autodj = "autodj.cli:main"
autodj-web = "autodj.server:main"
fhmusic = "autodj.server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
