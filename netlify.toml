# Frontend only. The backend (engine + WebSocket) runs on Railway.
# VITE_WS_URL is baked in at build time and only applies to Netlify builds;
# locally the app connects to /ws on its own host (see ./dev.sh).
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_WS_URL = "wss://fhmusic-production.up.railway.app/ws"
